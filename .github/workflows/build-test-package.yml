name: Build, test and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Aprint.sln

      - name: Build
        run: dotnet build Aprint.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Aprint.Tests/Aprint.Tests.csproj --configuration Release --no-build

      - name: Publish application
        run: dotnet publish src/Aprint/Aprint.csproj --configuration Release --no-build --output artifacts/publish

      - name: Define package version
        id: package-version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = "1.0.${{ github.run_number }}"
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -match '^v?(\d+\.\d+\.\d+(?:\.\d+)?)$') {
            $version = $Matches[1]
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Package with Inno Setup
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($null -eq $compiler) {
            $compilerPath = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          } else {
            $compilerPath = $compiler.Source
          }

          if (-not (Test-Path $compilerPath)) {
            throw "Inno Setup compiler was not found on the runner."
          }

          & $compilerPath "/DMyAppVersion=$env:PACKAGE_VERSION" "installer\scripts\aprint.iss"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aprint-${{ steps.package-version.outputs.version }}
          path: installer/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
